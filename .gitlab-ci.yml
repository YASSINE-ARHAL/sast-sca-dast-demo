
stages:
  - sast
  - sca
  - dast

sast:
  stage: sast
  tags:
    - docker-executor
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir bandit
    - bandit -r vulnerable_flask_app -f txt

sca:
  stage: sca
  tags:
    - docker-executor
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir pip-audit
    - pip-audit -r vulnerable_flask_app/requirements.txt

dast:
  stage: dast
  tags:
    - docker-executor
  image: ghcr.io/zaproxy/zaproxy:stable
  script:
    - zap-baseline.py -t "$DAST_TARGET_URL" -r zap-report.html
  artifacts:
    when: always
    paths:
      - zap-report.html
    expire_in: 7 days

